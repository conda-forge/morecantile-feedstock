schema_version: 1

context:
  version: "7.1.0"

package:
  name: morecantile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/morecantile/morecantile-${{ version }}.tar.gz
  sha256: 7faf41f8b3c364a322fe96d44f43b6ba55dc0ba7454222cebc3b695ffec4bc97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - morecantile = morecantile.scripts.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - attrs
    - pyproj >=3.1,<4.0
    - pydantic >=2.0,<3.dev0
    - click
    # optional
    - rasterio >=1.2.1

tests:
  - python:
      imports:
        - morecantile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - morecantile --help

about:
  summary: Construct and use map tile grids (a.k.a TileMatrixSet / TMS).
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/morecantile/
  repository: https://github.com/developmentseed/morecantile
  documentation: https://developmentseed.org/morecantile/

extra:
  recipe-maintainers:
    - lsetiawan
    - ocefpaf
